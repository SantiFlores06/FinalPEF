<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1670 1010" width="1670" height="1010" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3E4C59"/>
    </marker>
    <style>
      .lane-title { font-size: 15px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
      .node { fill: #FFFFFF; stroke-width: 1.5; }
      .t { font-size: 15px; font-weight: 700; fill: #1F2933; text-anchor: middle; }
      .ts { font-size: 13px; font-weight: 700; fill: #1F2933; text-anchor: middle; }
      .s { font-size: 12px; fill: #52606D; text-anchor: middle; }
      .pill-text { font-size: 12.5px; fill: #1F2933; text-anchor: middle; }
      .lbl { font-size: 11.5px; fill: #3E4C59; font-weight: 600; }
      .edge { fill: none; stroke: #3E4C59; stroke-width: 1.6; marker-end: url(#arrow); }
      .edge-ext { fill: none; stroke: #3E4C59; stroke-width: 1.6; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .ext { fill: #FFFFFF; stroke: #7B8794; stroke-width: 1.5; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect width="1670" height="1010" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="835" y="50" font-size="26" font-weight="700" fill="#1F2933" text-anchor="middle">Arquitectura — Travel Planner Multidestino</text>

  <!-- Lanes -->
  <rect x="30" y="75" width="400" height="875" rx="16" fill="#EEF4FB" stroke="#C9DAEE"/>
  <rect x="460" y="75" width="360" height="875" rx="16" fill="#EDF7F3" stroke="#C6E3D8"/>
  <rect x="850" y="75" width="440" height="875" rx="16" fill="#FDF6EA" stroke="#F0DDB8"/>
  <rect x="1320" y="75" width="320" height="875" rx="16" fill="#F2F4F7" stroke="#D5DAE1"/>

  <rect x="120" y="87" width="220" height="30" rx="15" fill="#2F6DB5"/>
  <text class="lane-title" x="230" y="107">Capa de presentación</text>
  <rect x="540" y="87" width="200" height="30" rx="15" fill="#2E8B6E"/>
  <text class="lane-title" x="640" y="107">Capa API</text>
  <rect x="960" y="87" width="220" height="30" rx="15" fill="#D98E1F"/>
  <text class="lane-title" x="1070" y="107">Núcleo (app.core)</text>
  <rect x="1380" y="87" width="200" height="30" rx="15" fill="#6B7A8C"/>
  <text class="lane-title" x="1480" y="107">Soporte</text>

  <!-- ===== Presentation ===== -->
  <rect x="150" y="165" width="140" height="46" rx="23" fill="#2F6DB5"/>
  <text x="220" y="193" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Usuario</text>

  <rect class="node" x="55" y="250" width="330" height="225" rx="12" stroke="#2F6DB5"/>
  <text class="t" x="220" y="277">UI Streamlit</text>
  <text class="s" x="220" y="297">streamlit_app.py + views/</text>
  <rect x="95" y="310" width="250" height="26" rx="13" fill="#EEF4FB" stroke="#9DBBE0"/>
  <text class="pill-text" x="220" y="328">Inicio</text>
  <rect x="95" y="342" width="250" height="26" rx="13" fill="#EEF4FB" stroke="#9DBBE0"/>
  <text class="pill-text" x="220" y="360">Ruta Multidestino</text>
  <rect x="95" y="374" width="250" height="26" rx="13" fill="#EEF4FB" stroke="#9DBBE0"/>
  <text class="pill-text" x="220" y="392">Mis Reservas</text>
  <rect x="95" y="406" width="250" height="26" rx="13" fill="#EEF4FB" stroke="#9DBBE0"/>
  <text class="pill-text" x="220" y="424">Estadísticas</text>
  <rect x="95" y="438" width="250" height="26" rx="13" fill="#EEF4FB" stroke="#9DBBE0"/>
  <text class="pill-text" x="220" y="456">Laboratorio (benchmark local)</text>

  <rect class="node" x="55" y="505" width="330" height="64" rx="12" stroke="#2F6DB5"/>
  <text class="t" x="220" y="532">api_client.py</text>
  <text class="s" x="220" y="552">cliente HTTP liviano (API_URL)</text>

  <rect class="node" x="55" y="605" width="170" height="80" rx="12" stroke="#2F6DB5"/>
  <text class="ts" x="140" y="632">maps.py +</text>
  <text class="ts" x="140" y="650">road_geometry.py</text>
  <text class="s" x="140" y="670">mapa (folium)</text>

  <rect class="node" x="235" y="605" width="170" height="80" rx="12" stroke="#2F6DB5"/>
  <text class="ts" x="320" y="632">Recomendaciones IA</text>
  <text class="s" x="320" y="650">gemini_</text>
  <text class="s" x="320" y="668">recommendations.py</text>

  <rect class="ext" x="55" y="750" width="170" height="76" rx="12"/>
  <text class="t" x="140" y="782">OSRM</text>
  <text class="s" x="140" y="802">geometría vial real</text>
  <rect class="ext" x="235" y="750" width="170" height="76" rx="12"/>
  <text class="t" x="320" y="782">Google Gemini</text>
  <text class="s" x="320" y="802">requiere GOOGLE_API_KEY</text>

  <!-- Presentation edges -->
  <path class="edge" d="M220,211 V248"/>
  <path class="edge" d="M220,475 V503"/>
  <path class="edge" d="M55,445 H42 V590 H140 V603"/>
  <path class="edge" d="M140,590 H320 V603"/>
  <circle cx="140" cy="590" r="3.5" fill="#3E4C59"/>
  <text class="lbl" x="240" y="584" text-anchor="middle">llamada directa, sin pasar por la API</text>
  <path class="edge-ext" d="M140,685 V748"/>
  <text class="lbl" x="148" y="721">HTTP</text>
  <path class="edge-ext" d="M320,685 V748"/>
  <text class="lbl" x="328" y="721">HTTP</text>

  <!-- api_client -> FastAPI -->
  <path class="edge" d="M385,537 H478"/>
  <text class="lbl" x="432" y="528" text-anchor="middle">HTTP / JSON</text>

  <!-- ===== API ===== -->
  <rect class="node" x="480" y="165" width="320" height="430" rx="12" stroke="#2E8B6E"/>
  <text class="t" x="640" y="194">FastAPI — server.py</text>
  <text class="s" x="640" y="214">localhost:8000 · validación con Pydantic</text>

  <rect x="500" y="245" width="280" height="40" rx="20" fill="#EDF7F3" stroke="#8CC7B1"/>
  <text class="pill-text" x="640" y="270">GET /routes/matrix</text>
  <rect x="500" y="301" width="280" height="40" rx="20" fill="#EDF7F3" stroke="#8CC7B1"/>
  <text class="pill-text" x="640" y="326">POST /routes/shortest</text>
  <rect x="500" y="357" width="280" height="40" rx="20" fill="#EDF7F3" stroke="#8CC7B1"/>
  <text class="pill-text" x="640" y="382">POST /routes/optimize-multi</text>
  <rect x="500" y="413" width="280" height="40" rx="20" fill="#EDF7F3" stroke="#8CC7B1"/>
  <text class="pill-text" x="640" y="438">POST /itinerary/plan</text>
  <rect x="500" y="469" width="280" height="40" rx="20" fill="#EDF7F3" stroke="#8CC7B1"/>
  <text class="pill-text" x="640" y="494">GET /stats/algorithms</text>
  <rect x="500" y="525" width="280" height="40" rx="20" fill="#EDF7F3" stroke="#8CC7B1"/>
  <text class="pill-text" x="640" y="550">POST /reservations (+ /batch)</text>

  <!-- API -> cache (top bus) -->
  <path class="edge" d="M640,165 V152 H1480 V163"/>
  <text class="lbl" x="1070" y="143" text-anchor="middle">get / set en caché (hit / miss)</text>

  <!-- API -> Core -->
  <path class="edge" d="M780,321 H835 V203 H868"/>
  <path class="edge" d="M780,377 H845 V330 H898"/>
  <path class="edge" d="M780,433 H855 V635 H868"/>
  <path class="edge" d="M780,489 H840 V735 H868"/>
  <!-- API -> Booking -->
  <path class="edge" d="M780,545 H810 V850 H1338"/>
  <text class="lbl" x="1070" y="842" text-anchor="middle">crear / consultar / cancelar reservas</text>

  <!-- ===== Core ===== -->
  <rect class="node" x="870" y="165" width="400" height="76" rx="12" stroke="#D98E1F"/>
  <text class="t" x="1070" y="195">graph.py — Dijkstra</text>
  <text class="s" x="1070" y="216">2 ciudades: camino mínimo por costo o tiempo</text>

  <polygon points="1070,270 1240,330 1070,390 900,330" fill="#FFFFFF" stroke="#D98E1F" stroke-width="1.5"/>
  <text class="ts" x="1070" y="327">choose_tsp_algorithm</text>
  <text class="s" x="1070" y="346">¿n ≤ 12 ciudades?</text>

  <path class="edge" d="M1070,390 V420"/>
  <path fill="none" stroke="#3E4C59" stroke-width="1.6" d="M965,420 H1175"/>
  <path class="edge" d="M965,420 V458"/>
  <path class="edge" d="M1175,420 V458"/>
  <text class="lbl" x="971" y="446">sí · 3 a 12</text>
  <text class="lbl" x="1181" y="446">no · 13 a 25</text>

  <rect class="node" x="870" y="460" width="190" height="84" rx="12" stroke="#D98E1F"/>
  <text class="ts" x="965" y="488">tsp_dp.py</text>
  <text class="s" x="965" y="508">Held-Karp (exacto)</text>
  <text class="s" x="965" y="526">O(n² · 2ⁿ)</text>

  <rect class="node" x="1080" y="460" width="190" height="84" rx="12" stroke="#D98E1F"/>
  <text class="ts" x="1175" y="488">tsp_genetic.py</text>
  <text class="s" x="1175" y="508">Genético (heurístico)</text>
  <text class="s" x="1175" y="526">tiempo acotado</text>

  <rect class="node" x="870" y="600" width="400" height="70" rx="12" stroke="#D98E1F"/>
  <text class="t" x="1070" y="628">itinerary_validator.py</text>
  <text class="s" x="1070" y="649">presupuesto, duración, ciudades y transportes</text>

  <rect class="node" x="870" y="700" width="400" height="70" rx="12" stroke="#D98E1F"/>
  <text class="t" x="1070" y="728">solver_metrics.py</text>
  <text class="s" x="1070" y="749">tiempo real de cada corrida no cacheada</text>

  <!-- ===== Support ===== -->
  <rect class="node" x="1340" y="165" width="280" height="150" rx="12" stroke="#6B7A8C"/>
  <text class="t" x="1480" y="192">app.caches</text>
  <text class="s" x="1480" y="212">cache_backend.py · CACHE_BACKEND</text>
  <rect x="1365" y="228" width="230" height="30" rx="15" fill="#F2F4F7" stroke="#B3BCC7"/>
  <text class="pill-text" x="1480" y="248">Redis (opcional)</text>
  <rect x="1365" y="268" width="230" height="30" rx="15" fill="#F2F4F7" stroke="#B3BCC7"/>
  <text class="pill-text" x="1480" y="288">LRU + TTL en memoria (default)</text>

  <rect class="node" x="1340" y="360" width="280" height="110" rx="12" stroke="#6B7A8C"/>
  <text class="t" x="1480" y="388">app.data</text>
  <text class="s" x="1480" y="409">cities.py: 180 ciudades, 6 continentes</text>
  <text class="s" x="1480" y="428">routes_fixed.py: auto, tren, avión, barco</text>
  <text class="s" x="1480" y="447">distancias con Haversine</text>

  <!-- data -> Core -->
  <path class="edge" d="M1340,408 H1305 V203 H1272"/>
  <path class="edge" d="M1305,330 H1242"/>
  <circle cx="1305" cy="330" r="3.5" fill="#3E4C59"/>
  <text class="lbl" x="1289" y="196" text-anchor="middle">grafo</text>
  <text class="lbl" x="1272" y="323" text-anchor="middle">matrices</text>

  <rect class="node" x="1340" y="800" width="280" height="130" rx="12" stroke="#6B7A8C"/>
  <text class="t" x="1480" y="827">app.booking</text>
  <text class="s" x="1480" y="847">ReservationManager (asyncio)</text>
  <text class="s" x="1480" y="865">ReservationBatchProcessor (lotes)</text>
  <text class="s" x="1480" y="892" font-style="italic">pending → processing →</text>
  <text class="s" x="1480" y="910" font-style="italic">confirmed · failed · cancelled</text>

  <!-- Legend -->
  <line x1="40" y1="978" x2="90" y2="978" stroke="#3E4C59" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="lbl" x="100" y="982">llamada interna</text>
  <line x1="230" y1="978" x2="280" y2="978" stroke="#3E4C59" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text class="lbl" x="290" y="982">llamada a servicio externo</text>
  <rect x="470" y="968" width="40" height="20" rx="6" class="ext"/>
  <text class="lbl" x="520" y="982">servicio externo</text>
</svg>
